<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A surprise for you</title>
<meta name="description" content="Someone made you a little Navratri surprise. Open it with your sound on.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Little Gasp">
<meta property="og:title" content="A Navratri surprise for you 🪔">
<meta property="og:description" content="Someone made you a little surprise. Open it with your sound on.">
<meta property="og:image" content="https://littlegasp.com/garba-circle/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E0B24">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/bg.webp">
<style>
:root{
  --night:#0A0920; --gold:#E9B44C; --gold-soft:#F6DFA8; --cream:#FFF4DF;
  --magenta:#D6246E; --crimson:#8C1230; --ink:#3A1420;
  --display:"DM Serif Display", Georgia, serif;
  --serif:"Cormorant Garamond", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Nanum Pen Script", "Comic Sans MS", cursive;
  --goldtext:linear-gradient(180deg,#FFE7A8 0%,#F2C25E 45%,#C98A2B 100%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--body);font-size:17px;line-height:1.5;color:var(--gold-soft);background:var(--night);-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;overflow:hidden;background:#0A0920 url(img/bg.webp) center / cover no-repeat}
main{position:relative;z-index:2;height:100%;max-width:460px;margin:0 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
body:not(.ready) main,body:not(.ready) #muteBtn{visibility:hidden}
.loading{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font:400 italic 1.6rem/1.2 var(--display);color:var(--gold);margin:0;text-align:center;padding:24px}
body.ready .loading{display:none}

/* painted props: bandhani drapes at the top, diyas at the bottom (hidden by fitProps() when text would touch them) */
.prop{position:absolute;z-index:1;pointer-events:none;transition:opacity .4s}
.drape{top:0;width:min(34%,170px)}
.drape.l{left:0}.drape.r{right:0}
.diya{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:min(17%,82px);filter:drop-shadow(0 0 14px rgba(255,170,60,.55))}
.diya.l{left:6px}.diya.r{right:6px;transform:scaleX(-1)}
body.drapes-off .drape,body.diyas-off .diya{opacity:0}
.diya img,.drape img{width:100%;display:block}
.flame{animation:flicker 2.4s ease-in-out infinite}

.scene{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 26px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);gap:10px}
.scene::before,.scene::after{content:"";flex:1 0 0}
.scene[hidden]{display:none}
.brand{font:600 1.05rem/1 var(--serif);letter-spacing:.02em;color:var(--gold-soft)}
.gold{background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(233,180,76,.25))}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.02;color:var(--gold)}
h1{font-size:clamp(2.9rem,14vw,3.9rem)}
h2{font-size:clamp(2.3rem,11vw,3rem)}
h1:focus,h2:focus{outline:none}
p{margin:0}
.sub{font:500 1.02rem/1.35 var(--body);letter-spacing:.03em;color:var(--cream);max-width:30ch}
.orn{display:flex;align-items:center;gap:10px;justify-content:center}
.orn::before,.orn::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}

/* painted buttons */
.btn{appearance:none;border:0;cursor:pointer;font:400 1.4rem/1 var(--display);color:#FFF3E0;letter-spacing:.01em;
  width:min(80vw,280px);aspect-ratio:600/125;padding:0 2.6rem;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  background:url(img/btn-yes.webp) center / 100% 100% no-repeat;text-shadow:0 1px 2px rgba(80,0,30,.6);
  filter:drop-shadow(0 6px 18px rgba(214,36,110,.55));transition:transform .08s,opacity .3s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn.next{width:min(78vw,270px);aspect-ratio:600/182;padding:0 3rem;font-size:1.22rem;white-space:nowrap;background-image:url(img/btn-next.webp);filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.btn.ghost{width:min(80vw,280px);aspect-ratio:600/105;background-image:url(img/btn-ghost.webp);padding:0 2rem;color:var(--gold-soft);font-size:1.2rem;filter:none;text-shadow:none}
.btn.start{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 6px 28px rgba(255,60,140,.85))}}
.btn:focus-visible,.dhol:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.btn[hidden]{display:none}

/* ===== the circle ===== */
.ring-wrap{position:relative;width:min(94vw,430px,calc(100vh - 330px));min-width:240px;aspect-ratio:1;flex:none}
@supports (height:1dvh){.ring-wrap{width:min(94vw,430px,calc(100dvh - 330px))}}
body.playing .ring-wrap{width:min(96vw,440px,calc(100vh - 300px))}
@supports (height:1dvh){body.playing .ring-wrap{width:min(96vw,440px,calc(100dvh - 300px))}}
body.playing .intro{display:none}
.ring-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.slot .lit-img,.slot .slot-img{opacity:0;transition:opacity .6s}
.slot.lit .lit-img,.slot.lit .slot-img{opacity:1}
.slot .halo{opacity:0;transition:opacity .6s}
.slot.lit .halo{opacity:.9}
.slot.pop{animation:pop .6s ease}
@keyframes pop{40%{transform:scale(1.28)}}
.garbo-glow{animation:flicker 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flicker{50%{opacity:.72;transform:scale(.95)}}
body.finale .garbo-glow{animation:none;opacity:1;transform:scale(1.5);transition:transform 1.2s}
#trails{transition:opacity .8s;opacity:0}
body.playing #trails,body.finale #trails{opacity:1}

/* play controls */
.play{display:flex;flex-direction:column;align-items:center;gap:6px}
.play[hidden]{display:none}
body:not(.playing) .feedback{display:none}
.feedback{height:1.3em;font:400 italic 1.2rem/1.3 var(--display);color:var(--gold-soft)}
.dhol{position:relative;appearance:none;border:0;background:none;padding:0;cursor:pointer;width:min(62vw,236px);aspect-ratio:537/349;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.dhol img{width:100%;height:100%;display:block;transition:transform .08s;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.dhol.hit img{transform:scale(.94)}
.dhol .lbl{position:absolute;left:22%;right:22%;top:20%;bottom:24%;display:flex;align-items:center;justify-content:center;font:400 1.3rem/1.02 var(--display);color:var(--gold-soft);pointer-events:none;text-shadow:0 1px 3px #000}
.pulse{position:absolute;left:50%;top:48%;width:118%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid var(--gold);opacity:0;pointer-events:none;box-shadow:0 0 18px rgba(233,180,76,.6)}
.pulse.go{animation:pulse .6s ease-out}
@keyframes pulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1);opacity:0}}
.beads{display:flex;gap:9px}
.beads i{width:12px;height:12px;rotate:45deg;border:1.5px solid var(--gold);background:rgba(10,9,32,.6);transition:background .2s,box-shadow .2s}
.beads i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.night-label{font:600 .82rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}

/* pop-out reveal */
.veil{position:absolute;inset:0;z-index:20;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(8,6,24,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto}
.veil[hidden]{display:none}
.reveal-in{animation:rise .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}}
/* reason: the painted arch card */
.arch{position:relative;width:min(84vw,330px);aspect-ratio:620/837;background:url(img/reason-card.webp) center / 100% 100% no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24% 16% 18%;color:var(--crimson);filter:drop-shadow(0 0 30px var(--c,#E9B44C)) drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.arch .tag{font:400 1.05rem/1 var(--display);color:var(--crimson)}
.arch .tag::after{content:"";display:block;width:70px;height:8px;margin:10px auto 0;background:radial-gradient(circle,#B8862F 2px,transparent 3px) center/8px 8px repeat-x}
.arch .big{font:400 clamp(1.6rem,8.4vw,2.1rem)/1.12 var(--display);color:var(--crimson)}
.arch .small{font:500 1rem/1.3 var(--body);color:#6B4A3A}
/* photo: the mirror frame */
.frame{position:relative;width:min(80vw,320px,52vh);aspect-ratio:1;filter:drop-shadow(0 0 26px var(--c,#2D4FD1))}
.frame>img.fr{position:absolute;inset:0;width:100%;height:100%}
.frame .ph{position:absolute;left:15.5%;top:15.5%;width:69%;height:69%;border-radius:50%;overflow:hidden;background:#F3E3BE}
.frame .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font:400 clamp(1.8rem,9vw,2.4rem)/1.08 var(--display);max-width:16ch}
.ntag{display:inline-block;font:400 1.05rem/1 var(--display);padding:9px 22px;border-radius:6px;background:var(--c);color:var(--tagInk,#FFF4DF);box-shadow:0 0 0 1.5px #E9B44C,0 0 0 4px rgba(10,9,32,.6),0 0 0 5.5px #B8862F}

/* letter: the painted scroll rising from the garbo */
.scroll-wrap{position:relative;width:min(86vw,350px);display:flex;flex-direction:column;align-items:center}
.scroll{position:relative;width:100%;min-height:calc(min(86vw,350px) * 1.3);background:url(img/letter-scroll.webp) center top / 100% 100% no-repeat;padding:15% 19% 34% 22%;text-align:left;color:var(--ink)}
.scroll p{font:500 1.12rem/1.42 var(--serif);margin:0 0 .6em;opacity:0;transform:translateY(8px)}
.scroll.reveal p{animation:in .7s ease forwards;animation-delay:calc(var(--i) * .55s + .3s)}
.scroll p.sign{font-family:var(--hand);font-size:1.75rem;line-height:1.1;color:var(--crimson);margin:0}
@keyframes in{to{opacity:1;transform:none}}
.unroll{animation:unroll 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes unroll{from{clip-path:inset(100% 0 0 0);transform:translateY(50px)}to{clip-path:inset(0 0 0 0)}}
.pot{width:92px;margin-top:-30px;filter:drop-shadow(0 0 26px rgba(255,170,60,.8))}

/* ask + finale: nine lit gems around the couple */
.gems{position:relative;width:min(80vw,330px,40vh);aspect-ratio:1;flex:none}
@supports (height:1dvh){.gems{width:min(80vw,330px,40dvh)}}
.gems img{position:absolute;display:block}
.gems .ringimg{inset:0;width:100%;height:100%;animation:turn 60s linear infinite}
.gems .couple{left:22%;top:22%;width:56%;height:56%;animation:turn 14s linear infinite reverse}
@keyframes turn{to{rotate:360deg}}
.kicker{font:400 clamp(2.6rem,12.5vw,3.4rem)/1 var(--display)}
.q{font:500 1.1rem/1.4 var(--body);color:var(--cream);max-width:28ch}
.ask-btns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px}
.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.made{font-size:.85rem;color:var(--gold-soft);opacity:.85}
.made a{color:var(--gold);font-weight:600}

.icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:30;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(233,180,76,.6);background:rgba(10,9,32,.65);color:var(--gold);font-size:1.05rem;cursor:pointer}
.icon-btn[hidden]{display:none}
canvas#petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}

/* ===== Laptops: centred phone-shaped stage, soft blurred sides ===== */
@media (min-width:700px) and (min-aspect-ratio:4/5){
  body{display:flex;justify-content:center;background:#07051A}
  body::before{content:"";position:fixed;inset:-60px;z-index:0;filter:blur(48px);opacity:.9;
    background:radial-gradient(circle at 18% 30%,rgba(214,36,110,.55),transparent 45%),radial-gradient(circle at 82% 70%,rgba(15,143,134,.5),transparent 45%),radial-gradient(circle at 75% 15%,rgba(245,158,27,.45),transparent 40%),#0B0820}
  #stage{z-index:1;width:min(100vw,56.25vh);height:100vh;transform:translateZ(0);box-shadow:0 0 0 1px rgba(233,180,76,.15),0 30px 80px rgba(0,0,0,.6)}
  main{max-width:none}
  .ring-wrap{width:min(90%,430px,calc(100dvh - 330px))}
  body.playing .ring-wrap{width:min(92%,440px,calc(100dvh - 300px))}
  .btn,.btn.ghost{width:280px} .btn.next{width:270px}
  .arch .big{font-size:2rem}
}
@supports (height:1dvh){ @media (min-width:700px) and (min-aspect-ratio:4/5){ #stage{width:min(100vw,56.25dvh);height:100dvh} } }
@media (max-height:640px){ h1{font-size:2.6rem} .scene{gap:7px} }

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="stage">
<div class="prop drape l" aria-hidden="true"><img src="img/corner-l.webp" alt=""></div>
<div class="prop drape r" aria-hidden="true"><img src="img/corner-r.webp" alt=""></div>
<div class="prop diya l" aria-hidden="true"><img class="flame" src="img/diya.webp" alt=""></div>
<div class="prop diya r" aria-hidden="true"><img class="flame" src="img/diya.webp" alt=""></div>
<button class="icon-btn" id="muteBtn" hidden aria-pressed="false" aria-label="Mute music">♪</button>
<canvas id="petals" aria-hidden="true"></canvas>
<p class="loading" id="loading" role="status">Opening your surprise…</p>

<main>
  <!-- One live scene: the circle -->
  <section class="scene" data-scene="circle">
    <p class="brand intro">Little Gasp</p>
    <h1 tabindex="-1" class="intro gold">For <span data-to></span></h1>
    <p class="sub intro" id="countLine"></p>
    <div class="ring-wrap">
      <svg viewBox="-205 -205 410 410" id="ring" role="img" aria-label="A garba circle seen from above">
        <defs>
          <radialGradient id="floor"><stop offset="0" stop-color="#3A1530" stop-opacity=".95"/><stop offset=".55" stop-color="#1B1030" stop-opacity=".85"/><stop offset="1" stop-color="#0A0920" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#FFD27A" stop-opacity=".95"/><stop offset=".45" stop-color="#F59E1B" stop-opacity=".4"/><stop offset="1" stop-color="#F59E1B" stop-opacity="0"/></radialGradient>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
        </defs>
        <circle r="205" fill="url(#floor)"/>
        <g id="mandala"></g>
        <g id="trails" filter="url(#soft)"></g>
        <g id="slots"></g>
        <g id="dancers"></g>
        <g id="garbo">
          <circle class="garbo-glow" r="78" fill="url(#glow)"/>
          <image href="img/garbo.webp" x="-40" y="-40" width="80" height="80"/>
        </g>
      </svg>
    </div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="btn start" id="startBtn">Start the raas</button>
    <div class="play" id="play" hidden>
      <button class="dhol" id="dhol" aria-label="Tap the dhol on the beat">
        <span class="pulse" id="pulse"></span>
        <img src="img/dhol.webp" alt="">
        <span class="lbl">Tap on<br>the beat</span>
      </button>
      <div class="beads" id="beads" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="night-label orn" id="nightLabel"></p>
    </div>
    <button class="btn next" id="afterBtn" hidden data-next></button>
  </section>

  <!-- Letter -->
  <section class="scene" data-scene="letter" hidden>
    <h2 tabindex="-1" class="gold">Happy Navratri</h2>
    <div class="scroll-wrap">
      <article class="scroll unroll" id="letter"></article>
      <img class="pot flame" src="img/garbo.webp" alt="">
    </div>
    <button class="btn next" data-next></button>
  </section>

  <!-- Question -->
  <section class="scene" data-scene="ask" hidden>
    <div class="gems" aria-hidden="true"><img class="ringimg" src="img/final-ring.webp" alt=""><img class="couple" src="img/couple.webp" alt=""></div>
    <p class="kicker gold">Ek raas,<br>mere saath?</p>
    <h2 tabindex="-1" class="q" id="question"></h2>
    <div class="ask-btns" id="askBtns">
      <button class="btn" id="yesBtn">Yes!</button>
      <button class="btn ghost" id="againBtn">Ask me again</button>
    </div>
  </section>

  <!-- Finale -->
  <section class="scene" data-scene="end" hidden>
    <div class="gems" aria-hidden="true"><img class="ringimg" src="img/final-ring.webp" alt=""><img class="couple" src="img/couple.webp" alt=""></div>
    <p class="sub">Happy Navratri, <span data-to></span></p>
    <h2 tabindex="-1" id="endTitle" class="gold">You said yes!</h2>
    <p class="sub" id="yesReply"></p>
    <button class="btn ghost" id="replay">Watch it again</button>
    <p class="made">Made with love on <a href="https://littlegasp.com/" target="_blank" rel="noopener">Little Gasp</a></p>
  </section>
</main>

<!-- pop-out reveal (a reason card or a photo in the mirror frame) -->
<div class="veil" id="veil" hidden role="dialog" aria-modal="true" aria-labelledby="cardTag">
  <div id="reveal"></div>
  <button class="btn next" id="cardBtn">Tap to dance on</button>
</div>
</div><!-- /stage -->

<script>
/* ============ SETUP ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbxf3nRN3zgwfa7hP3PfyRqLTO9xQ4ukKOo44DbxSdb4eKeXfnQ_MjgdlqVZSLztdr9S/exec";
/* =============================== */

/* Demo (no ?id=): used for Instagram and the homepage showcase */
const DEMO = {
  to: "Priya", from: "Rohan", number: "7",
  photos: [
    { src: "img/demo-1.svg", caption: "Our first garba night" },
    { src: "img/demo-2.svg", caption: "The night we won the dandiya round" },
    { src: "img/demo-3.svg", caption: "Matching outfits, finally" }
  ],
  reasons: ["You dance like no one's watching","You never miss a single aarti","Your laugh is louder than the dhol","You hold my hand in every circle","You make every night feel like the ninth"],
  letter: ["My dearest Priya,","Nine nights of music, and every beat still leads me to you.","Thank you for turning every circle into home."],
  question: "Will you be my dandiya partner this Navratri?",
  yesReply: "Then tonight we dance till the last aarti."
};

/* The nine nights. 2026 starts on a Sunday, so the day colours run in this order. */
const NIGHTS = [
  { c:"#F57C1F", name:"Orange",        devi:"Shailaputri" },
  { c:"#F5F1E8", name:"White",         devi:"Brahmacharini", ink:"#5A3A20" },
  { c:"#D7263D", name:"Red",           devi:"Chandraghanta" },
  { c:"#2D4FD1", name:"Royal blue",    devi:"Kushmanda" },
  { c:"#F7C61B", name:"Yellow",        devi:"Skandamata", ink:"#5A3A20" },
  { c:"#2E9E4A", name:"Green",         devi:"Katyayani" },
  { c:"#8A8C94", name:"Grey",          devi:"Kalaratri" },
  { c:"#7B2FBE", name:"Purple",        devi:"Mahagauri" },
  { c:"#0F8F86", name:"Peacock green", devi:"Siddhidatri" }
];
const LABELS = { letter:"Read your letter", ask:"One last question", end:"Finish" };
/* Background song. With a src it plays this licensed track (and the dhol game follows its beat: bpm + offset of the first beat in seconds);
   without one it plays our own synthesised garba groove. Only use tracks we have the rights to (e.g. Pixabay licence). */
const SONG = { src: "", bpm: 0, offset: 0, volume: .85, credit: "" };

const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const qs = new URLSearchParams(location.search);
const id = qs.get("id"), isPreview = qs.has("preview"), isAuto = qs.has("autoplay");
if (isAuto) HTMLElement.prototype.focus = function(){};   // never pull the parent page around
let C, seq = [], current = 0, items = [];

/* ---------- load ---------- */
function waitForPreviewData(){
  return new Promise(res => {
    addEventListener("message", e => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === "tsc-data") res(e.data.data);
    });
    parent.postMessage({ type: "tsc-ready" }, location.origin);
  });
}
function addWatermark(){
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='280' height='180'><text x='10' y='105' transform='rotate(-25 140 90)' font-family='Arial,sans-serif' font-weight='700' font-size='22' fill='rgba(233,180,76,0.30)'>PREVIEW · Little Gasp</text></svg>";
  const wm = document.createElement("div"); wm.setAttribute("aria-hidden", "true");
  wm.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:40;background-image:url(\"data:image/svg+xml," + encodeURIComponent(svg) + "\")";
  const band = document.createElement("div"); band.textContent = "PREVIEW · Unlock to remove watermark";
  band.style.cssText = "position:absolute;left:0;right:0;bottom:0;z-index:41;pointer-events:none;background:rgba(214,36,110,.9);color:#fff;font:700 13px/1 Figtree,system-ui,sans-serif;text-align:center;padding:9px 6px;letter-spacing:.04em";
  $("#stage").append(wm, band);
}
function showError(msg){ document.body.classList.add("ready"); $("main").hidden = true; const l = $("#loading"); l.style.display = "flex"; l.textContent = msg; }
async function start(){
  try {
    let d = DEMO;
    if (isAuto) d = DEMO;
    else if (isPreview) { d = await waitForPreviewData(); addWatermark(); }
    else if (id) {
      const res = await fetch(API_URL + "?id=" + encodeURIComponent(id));
      d = await res.json();
      if (!d || d.error) throw new Error(d && d.error);
    }
    build(d);
    document.body.classList.add("ready");
    if (isAuto) runAutoplay();
  } catch (e) {
    showError("This surprise link doesn't look right. Please check it, or message @littlegasp.co on Instagram.");
  }
}
setTimeout(start, 0);

function build(d){
  C = {
    to: (d.to || "you").trim(), from: (d.from || "").trim(), number: String(d.number || "").trim(),
    photos: (d.photos || []).filter(p => p && p.src !== undefined).slice(0, 4),
    reasons: (d.reasons || []).filter(Boolean).slice(0, 5),
    letter: (d.letter || []).filter(Boolean),
    question: (d.question || "").trim(), yesReply: (d.yesReply || "").trim()
  };
  if (id) C.photos = C.photos.filter(p => p.src);
  document.title = "A Navratri surprise for " + C.to;
  document.querySelectorAll("[data-to]").forEach(e => e.textContent = C.to);
  const n = /^\d{1,3}$/.test(C.number) ? +C.number : 0;
  $("#countLine").textContent = n ? `${n} Navratri${n === 1 ? "" : "s"} together. One partner.` : "Nine nights. One partner.";

  /* photos and reasons take turns, then spread across the nine nights */
  const mixed = [], P = C.photos.map(p => ({ t:"photo", ...p })), R = C.reasons.map(r => ({ t:"reason", text:r }));
  while (P.length || R.length){ if (P.length) mixed.push(P.shift()); if (R.length) mixed.push(R.shift()); }
  items = Array(9).fill(null);
  mixed.slice(0, 9).forEach((it, i, a) => { items[Math.floor(i * 9 / a.length)] = it; });

  seq = ["circle"];
  if (C.letter.length) seq.push("letter");
  if (C.question) seq.push("ask");
  seq.push("end");
  document.querySelectorAll("[data-scene]").forEach(sc => {
    const i = seq.indexOf(sc.dataset.scene);
    const b = sc.querySelector("[data-next]");
    if (b && i > -1 && seq[i + 1]) b.textContent = LABELS[seq[i + 1]];
  });

  buildRing(); buildLetter();
  if (SONG.src && !isAuto){ song = new Audio(SONG.src); song.loop = true; song.preload = "auto"; }
  $("#question").textContent = C.question;
  $("#yesReply").textContent = C.yesReply;
  if (!C.question) $("#endTitle").textContent = C.from ? "With love, " + C.from : "Nine nights. One circle.";
  go("circle");
  requestAnimationFrame(frame);
}

/* ---------- scenes ---------- */
function go(name){
  current = seq.indexOf(name);
  document.querySelectorAll("[data-scene]").forEach(s => s.hidden = s.dataset.scene !== name);
  $("main").scrollTo(0, 0);
  const h = document.querySelector(`[data-scene="${name}"]`).querySelector("h1,h2");
  if (h && !isPreview) h.focus({ preventScroll:true });
  if (name === "letter"){ $("#letter").classList.add("reveal"); fitLetter(); }
  requestAnimationFrame(fitProps);
}

/* painted props leave when text or buttons would touch them; each pair leaves together */
function fitProps(){
  const sc = document.querySelector(`[data-scene="${seq[current]}"]`); if (!sc) return;
  const B = document.body; B.classList.remove("drapes-off", "diyas-off");
  const items = [...sc.querySelectorAll("h1,h2,p,.btn,.ring-wrap,.dhol,.gems,.scroll-wrap,.made")].filter(e => e.offsetParent && !e.hidden).map(e => e.getBoundingClientRect()).filter(r => r.width && r.height);
  const hits = sel => [...document.querySelectorAll(sel)].map(e => e.getBoundingClientRect()).some(p =>
    items.some(t => t.left < p.right - 6 && t.right > p.left + 6 && t.top < p.bottom - 6 && t.bottom > p.top + 6));
  B.classList.toggle("drapes-off", hits(".drape"));
  B.classList.toggle("diyas-off", hits(".diya"));
}
addEventListener("resize", () => requestAnimationFrame(fitProps));

/* long letters: shrink the writing until it fits the scroll, then let the scroll grow */
function fitLetter(){
  const L = $("#letter"), ps = [...L.querySelectorAll("p:not(.sign)")];
  L.style.minHeight = L.style.paddingBottom = ""; ps.forEach(p => p.style.fontSize = "");
  const base = L.getBoundingClientRect().width * 1.3, padB = parseFloat(getComputedStyle(L).paddingBottom);
  const need = () => L.offsetHeight;   // the scroll only grows past its painted size when the writing overflows
  let fs = 1.12;
  while (need() > base + 2 && fs > .9){ fs -= .04; ps.forEach(p => p.style.fontSize = fs + "rem"); }
  if (need() > base + 2){
    /* still too long: grow the scroll, keeping the writing inside the cloth and out of the light beam */
    const content = L.offsetHeight - padB, h = content / .66;
    L.style.minHeight = h + "px"; L.style.paddingBottom = (h * .34) + "px";
  }
}
document.querySelectorAll("[data-next]").forEach(b => b.addEventListener("click", () => {
  const nxt = seq[current + 1]; if (!nxt) return;
  go(nxt); if (nxt === "end") petals(220);
}));

/* ---------- drawing the circle (painted pieces from the Canva design) ---------- */
const SLOT_R = 166, DANCE_R = 100, SLOT_S = 66, LIT_S = 74, PHOTO_R = 19.5;
let slotEls = [], dancerEls = [];
function buildRing(){
  const m = $("#mandala");
  /* gold floor mandala: dotted rings, two rows of petals, an outer ring with little leaves */
  el("circle", { r:196, fill:"none", stroke:"#E9B44C", "stroke-opacity":.55, "stroke-width":1.2 }, m);
  for (let i = 0; i < 18; i++){ const a = i * Math.PI / 9;
    el("path", { d:"M0 -4 C3 -1 3 2 0 4 C-3 2 -3 -1 0 -4Z", fill:"#E9B44C", opacity:.75, transform:`rotate(${i * 20}) translate(0 -196)` }, m); }
  el("circle", { r:136, fill:"none", stroke:"#E9B44C", "stroke-opacity":.35, "stroke-width":1, "stroke-dasharray":"1.5 5" }, m);
  for (let i = 0; i < 24; i++) el("path", { d:"M0 -60 C9 -50 9 -36 0 -28 C-9 -36 -9 -50 0 -60Z", fill:"#7A1F3D", "fill-opacity":.55, stroke:"#E9B44C", "stroke-opacity":.7, "stroke-width":.8, transform:`rotate(${i * 15})` }, m);
  for (let i = 0; i < 12; i++) el("path", { d:"M0 -42 C7 -34 7 -24 0 -18 C-7 -24 -7 -34 0 -42Z", fill:"#B8862F", "fill-opacity":.35, stroke:"#F6DFA8", "stroke-opacity":.6, "stroke-width":.7, transform:`rotate(${i * 30 + 15})` }, m);
  el("circle", { r:64, fill:"none", stroke:"#E9B44C", "stroke-opacity":.6, "stroke-width":1 }, m);

  /* light trails that follow the dancers */
  const tr = $("#trails");
  ["#D6246E","#2D4FD1","#F59E1B","#7B2FBE","#0F8F86"].forEach((c, i) => {
    const a0 = i * 72, r = DANCE_R + (i % 2 ? 14 : -6);
    const p = el("path", { d: arc(r, a0, a0 + 48), fill:"none", stroke:c, "stroke-width":3.5, "stroke-linecap":"round", opacity:.7 }, tr);
  });

  const sg = $("#slots");
  NIGHTS.forEach((nt, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 9, x = Math.cos(a) * SLOT_R, y = Math.sin(a) * SLOT_R;
    const pos = el("g", { transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})` }, sg);
    const g = el("g", { class:"slot" }, pos);   /* the pop animation scales this inner group, never the position */
    g.style.transformBox = "fill-box"; g.style.transformOrigin = "center";
    el("circle", { class:"halo", r:36, fill:nt.c, filter:"url(#halo)" }, g);
    el("image", { href:"img/slot-dark.webp", x:-SLOT_S / 2, y:-SLOT_S / 2, width:SLOT_S, height:SLOT_S }, g);
    el("image", { class:"lit-img", href:`img/slot-${i + 1}.webp`, x:-LIT_S / 2, y:-LIT_S / 2, width:LIT_S, height:LIT_S }, g);
    const it = items[i];
    if (it && it.t === "photo" && it.src){
      const cp = el("clipPath", { id:"sc" + i }, g); el("circle", { r:PHOTO_R }, cp);
      const im = el("image", { class:"slot-img", href:it.src, x:-PHOTO_R, y:-PHOTO_R, width:PHOTO_R * 2, height:PHOTO_R * 2, preserveAspectRatio:"xMidYMid slice", "clip-path":`url(#sc${i})` }, g);
      im.addEventListener("error", () => im.remove());
    }
    slotEls.push({ g });
  });

  const dg = $("#dancers");
  for (let i = 0; i < 8; i++){
    const g = el("g", {}, dg), inner = el("g", {}, g);
    el("image", { href:`img/dancer-${i + 1}.webp`, x:-42, y:-42, width:84, height:84 }, inner);
    dancerEls.push({ g, inner, base: i * Math.PI / 4, tw: (i * 47) % 360 });
  }
}
function arc(r, a0, a1){
  const p = d => [Math.cos(d * Math.PI / 180) * r, Math.sin(d * Math.PI / 180) * r].map(v => v.toFixed(1)).join(" ");
  return `M${p(a0)} A${r} ${r} 0 0 1 ${p(a1)}`;
}
function lightSlot(i){
  const s = slotEls[i]; s.g.classList.add("lit", "pop");
  setTimeout(() => s.g.classList.remove("pop"), 650);
}

/* ---------- motion ---------- */
let angle = 0, speed = 0, target = 0, last = performance.now(), spin = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  speed += (target - speed) * Math.min(1, dt * 2.5);
  if (!reduce){ angle += speed * dt; spin += speed * dt; }
  dancerEls.forEach((d, i) => {
    const a = d.base + angle, bob = Math.sin(now / 300 + i) * 3 * Math.min(1, speed);
    d.g.setAttribute("transform", `translate(${(Math.cos(a) * (DANCE_R + bob)).toFixed(1)} ${(Math.sin(a) * (DANCE_R + bob)).toFixed(1)})`);
    /* each dancer turns with the circle and twirls a little on the beat */
    d.inner.setAttribute("transform", `rotate(${(a * 57.3 + d.tw + Math.sin(spin * 2 + i) * 25).toFixed(1)})`);
  });
  $("#trails").setAttribute("transform", `rotate(${(angle * 57.3).toFixed(1)})`);
  requestAnimationFrame(frame);
}

/* ---------- audio: an original garba groove + dhol taps (all synthesised, no music files) ---------- */
let ctx, master, bus, muted = false;
function ensureAudio(){
  if (isAuto) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  if (!ctx){
    ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : .6; master.connect(ctx.destination);
    bus = ctx.createGain(); bus.gain.value = .7; bus.connect(master);          // the song sits under the player's own taps
  }
  if (ctx.state === "suspended") ctx.resume();
}
document.addEventListener("visibilitychange", () => {
  if (ctx) document.hidden ? ctx.suspend() : ctx.resume();
  if (song && song.dataset.started) document.hidden ? song.pause() : song.play().catch(() => {});
});
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, rel){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + rel); }
let noiseBuf;
function noise(){ if (!noiseBuf){ const n = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s; }
function dhum(t, vol = .9, out = master){                     // dhol bass side
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(55, t + .22);
  env(g, t, .004, vol, .38); o.connect(g); g.connect(out); o.start(t); o.stop(t + .45);
}
function tak(t, vol = .35, out = master){                     // dhol treble side
  const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 1.4; env(g, t, .002, vol, .07);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + .1);
  const o = ctx.createOscillator(), g2 = ctx.createGain(); o.frequency.value = 520; env(g2, t, .002, vol * .5, .09);
  o.connect(g2); g2.connect(out); o.start(t); o.stop(t + .12);
}
function dandiya(t, vol = .22){                               // two wooden sticks meeting
  [0, .018].forEach((d, k) => { const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = "bandpass"; f.frequency.value = k ? 1650 : 1250; f.Q.value = 6; env(g, t + d, .001, vol, .045);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t + d); s.stop(t + d + .07); });
}
function manjira(t, vol = .05, len = .25){                    // little cymbals
  const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "highpass"; f.frequency.value = 6500; env(g, t, .002, vol, len);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + len + .05);
  const o = ctx.createOscillator(), g2 = ctx.createGain(); o.type = "triangle"; o.frequency.value = 4186; env(g2, t, .002, vol * .4, len * 1.4);
  o.connect(g2); g2.connect(bus); o.start(t); o.stop(t + len * 1.5);
}
function drone(t, len){                                       // harmonium Sa-Pa-Sa held under everything
  [[50, .05], [57, .035], [62, .03]].forEach(([m, v]) => { const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = hz(m); f.type = "lowpass"; f.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .15); g.gain.setValueAtTime(v, t + len - .1); g.gain.linearRampToValueAtTime(0.0001, t + len + .05);
    o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + len + .1); });
}
function shehnai(m, t, len, vol = .085){                      // reedy lead with a gentle vibrato
  const f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
  f.type = "lowpass"; f.frequency.value = 2600; f.Q.value = 3;
  lfo.frequency.value = 5.6; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(m) * .012, t + Math.min(.25, len * .6));
  lfo.connect(lg);
  [["sawtooth", 0], ["square", 4]].forEach(([type, det]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = det;
    lg.connect(o.frequency); o.connect(f); o.start(t); o.stop(t + len + .12); });
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .035); g.gain.setValueAtTime(vol * .85, t + Math.max(.04, len - .06)); g.gain.linearRampToValueAtTime(0.0001, t + len + .1);
  f.connect(g); g.connect(bus); lfo.start(t); lfo.stop(t + len + .12);
}
function bell(freq = 1320){
  if (!ctx) return; const t = ctx.currentTime;
  [[freq, .25], [freq * 2.76, .08]].forEach(([f, v]) => { const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.7); });
}

/* The tune: our own melody in raag Khamaj (Sa = D). Each note is [swara in semitones from Sa, start eighth, length in eighths]. */
const SA = 62, EIGHTH = .3;   // 0.3s eighths = the game's 600ms beat
const A = [ [[7,0,2],[9,2,1],[7,3,1],[5,4,1],[4,5,1],[5,6,2]],
            [[4,0,1],[2,1,1],[4,2,2],[0,4,4]],
            [[4,0,1],[5,1,1],[7,2,2],[9,4,1],[10,5,1],[9,6,2]],
            [[7,0,2],[5,2,1],[4,3,1],[2,4,2],[0,6,2]] ];
const B = [ [[12,0,2],[10,2,1],[9,3,1],[7,4,2],[9,6,1],[10,7,1]],
            [[12,0,3],[14,3,1],[12,4,2],[10,6,2]],
            [[9,0,1],[7,1,1],[9,2,1],[10,3,1],[12,4,2],[9,6,2]],
            [[7,0,1],[5,1,1],[4,2,1],[5,3,1],[4,4,1],[2,5,1],[0,6,2]] ];
const TUNE = [...A, ...A, ...B, ...A];
const Music = { on:false, bar:0, next:0, timer:null, t0:0,
  start(){
    if (!ctx || this.on) return;
    this.on = true; this.bar = 0; this.t0 = this.next = ctx.currentTime + .12;
    this.tick(); this.timer = setInterval(() => this.tick(), 100);
    return this.t0;
  },
  tick(){ while (this.next < ctx.currentTime + .5){ this.playBar(this.next, this.bar); this.next += 8 * EIGHTH; this.bar++; } },
  playBar(t, i){
    const e = k => t + k * EIGHTH + (k % 2 ? .035 : 0);           // a little garba lilt on the off-beats
    drone(t, 8 * EIGHTH);
    [[0,.75],[3,.5],[4,.65],[6,.45]].forEach(([k, v]) => dhum(e(k), v, bus));
    [[1,.1],[2,.22],[5,.2],[7,.16]].forEach(([k, v]) => tak(e(k), v, bus));
    if (i >= 1){ dandiya(e(2)); dandiya(e(6)); }
    for (let k = 1; k < 8; k += 2) manjira(e(k), .03, .12);
    if (i % 2 === 0) manjira(t, .06, .9);
    if (i < 2) return;                                             // two bars of drums first, then the tune
    TUNE[(i - 2) % TUNE.length].forEach(([sw, at, len]) => shehnai(SA + sw, e(at), len * EIGHTH - .02));
  }
};
$("#muteBtn").addEventListener("click", e => {
  muted = !muted; if (master) master.gain.value = muted ? 0 : .6; if (song) song.muted = muted;
  e.currentTarget.setAttribute("aria-pressed", muted);
  e.currentTarget.setAttribute("aria-label", muted ? "Unmute music" : "Mute music");
  e.currentTarget.textContent = muted ? "✕" : "♪";
});

/* ---------- the beat game (can't be lost: every tap counts, on-beat taps count double) ---------- */
const BEAT = 600, NEED = 4;
let playing = false, beatT0 = 0, beatTimer, night = 0, score = 0, paused = false;
function now(){ return performance.now(); }
let song = null;                                   // the <audio> for SONG.src, when there is one
const songOn = () => song && !song.paused && SONG.bpm > 0;
function beatMs(){ if (!songOn()) return BEAT; const b = 60000 / SONG.bpm; return SONG.bpm > 125 ? b * 2 : b; }   // fast songs: tap every other beat
function beatClock(){                                 // ms since the start of the song/groove, on the beat grid
  return songOn() ? (song.currentTime - SONG.offset) * 1000 : now() - beatT0;
}
function phase(){ const m = beatMs(); return ((beatClock() % m) + m) % m; }
let lastBeat = -1;
function scheduleBeats(){
  /* the ring pulses on the music's beat */
  lastBeat = Math.floor(beatClock() / beatMs());
}
(function beatLoop(){
  if (playing && !paused){
    const b = Math.floor(beatClock() / beatMs());
    if (b !== lastBeat){ lastBeat = b; const p = $("#pulse"); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go"); }
  }
  requestAnimationFrame(beatLoop);
})();
const GOOD = ["On the beat!","Beautiful","Keep going","Shabaash!","Perfect step"];
function onDhol(){
  if (!playing || paused) return;
  ensureAudio(); if (ctx) dhum(ctx.currentTime, .9);
  const d = $("#dhol"); d.classList.add("hit"); setTimeout(() => d.classList.remove("hit"), 90);
  const off = phase(), dist = Math.min(off, beatMs() - off);
  const good = dist < Math.min(170, beatMs() * .28);
  score += good ? 1 : .5;
  target = Math.min(2.6, target + (good ? .5 : .2));
  $("#feedback").textContent = good ? GOOD[Math.floor(Math.random() * GOOD.length)] : "Feel the dhol…";
  [...$("#beads").children].forEach((b, i) => b.classList.toggle("on", i < Math.floor(score)));
  if (score >= NEED) nightDone();
}
$("#dhol").addEventListener("pointerdown", e => { e.preventDefault(); onDhol(); });
$("#dhol").addEventListener("click", e => { if (e.detail === 0) onDhol(); });   // keyboard
setInterval(() => { if (playing && !paused) target = Math.max(.9, target - .25); }, 700);   // slows a little if nobody taps

$("#startBtn").addEventListener("click", startRaas);
function startRaas(){
  ensureAudio();
  beatT0 = now();
  if (song){ song.dataset.started = 1; song.volume = SONG.volume; song.muted = muted; song.play().catch(() => { song = null; if (ctx){ const t = Music.start(); if (t) beatT0 = now() + (t - ctx.currentTime) * 1000; } }); }
  const t0 = ctx && !song && Music.start();
  if (t0) beatT0 = now() + (t0 - ctx.currentTime + (ctx.outputLatency || ctx.baseLatency || 0)) * 1000;   // tap timing follows the song
  $("#startBtn").hidden = true; $("#play").hidden = false; $("#muteBtn").hidden = !ctx && !song;
  document.body.classList.add("playing"); requestAnimationFrame(fitProps);
  playing = true; target = 1.1; nextNight(true);
}
function nextNight(first){
  score = 0; [...$("#beads").children].forEach(b => b.classList.remove("on"));
  $("#nightLabel").textContent = `Night ${night + 1} of 9`;
  $("#feedback").textContent = first ? "Tap the dhol when the ring pulses" : "";
  paused = false; scheduleBeats();
  if (!isPreview && !isAuto) $("#dhol").focus({ preventScroll:true });
}
function nightDone(){
  paused = true; clearInterval(beatTimer);
  const i = night; lightSlot(i); bell(1100 + i * 60);
  setTimeout(() => showCard(i), reduce ? 0 : 450);
}
function showCard(i){
  const nt = NIGHTS[i], it = items[i], box = $("#reveal"), veil = $("#veil"), btn = $("#cardBtn");
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  veil.style.setProperty("--c", nt.c); veil.style.setProperty("--tagInk", nt.ink || "#FFF4DF");
  box.innerHTML = ""; box.className = "reveal-in";
  const label = `Night ${i + 1} · ${nt.name}`;
  if (it && it.t === "photo"){
    /* the photo sits in the painted mirror frame, caption and night tag below */
    box.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:14px";
    const f = mk("div", "frame"), ph = mk("div", "ph"), fr = mk("img", "fr");
    fr.src = "img/photo-frame.webp"; fr.alt = "";
    if (it.src){ const im = mk("img"); im.src = it.src; im.alt = it.caption || "Photo"; im.onerror = () => im.remove(); ph.appendChild(im); }
    f.append(fr, ph); box.appendChild(f);
    if (it.caption) box.appendChild(mk("p", "cap gold", it.caption));
    const t = mk("span", "ntag", label); t.id = "cardTag"; box.appendChild(t);
  } else {
    /* a reason (or an empty night's Devi) on the painted arch card */
    box.style.cssText = "";
    const card = mk("div", "arch"), t = mk("p", "tag", label); t.id = "cardTag";
    card.appendChild(t);
    if (it && it.t === "reason") card.appendChild(mk("p", "big", it.text));
    else { card.appendChild(mk("p", "big", nt.devi)); card.appendChild(mk("p", "small", "One more round together.")); }
    box.appendChild(card);
  }
  veil.appendChild(btn); btn.className = "btn next";   /* same button, same place, for photos and reasons */
  btn.textContent = i === 8 ? "Light up the circle" : "Tap to dance on";
  veil.hidden = false;
  if (!isPreview && !isAuto) btn.focus({ preventScroll:true });
}
$("#cardBtn").addEventListener("click", () => {
  $("#veil").hidden = true;
  night++;
  if (night < 9) nextNight(false); else finale();
});
function finale(){
  playing = false; clearInterval(beatTimer); target = .35;
  $("#play").hidden = true;
  document.body.classList.remove("playing"); document.body.classList.add("finale");
  requestAnimationFrame(fitProps);
  if (ctx){ const t = ctx.currentTime; [0, .15, .3, .6].forEach((d, k) => dhum(t + d, .9 - k * .1)); }
  [0, 250, 500].forEach((d, k) => setTimeout(() => bell(990 + k * 330), d));
  petals(200);
  $("#countLine").textContent = "All nine nights, lit for you.";
  const b = $("#afterBtn"); b.hidden = false;
  if (!isPreview && !isAuto) setTimeout(() => b.focus({ preventScroll:true }), 300);
}

/* ---------- letter ---------- */
function buildLetter(){
  const L = $("#letter");
  C.letter.forEach((t, i) => { const p = document.createElement("p"); p.textContent = t; p.style.setProperty("--i", i); L.appendChild(p); });
  if (C.from){ const s = document.createElement("p"); s.className = "sign"; s.textContent = "Always yours, " + C.from; s.style.setProperty("--i", C.letter.length); L.appendChild(s); }
}

/* ---------- ask ---------- */
const AGAIN = ["Okay, asking again…", "One more time, nicely…", "Last time, promise"];
let asks = 0;
$("#againBtn").addEventListener("click", () => {
  const q = $("#question"); q.classList.remove("shake"); void q.offsetWidth; q.classList.add("shake");
  if (asks < AGAIN.length) $("#againBtn").textContent = AGAIN[asks];
  asks++;
  if (asks > AGAIN.length){ $("#againBtn").textContent = "Fine, yes!"; $("#againBtn").onclick = sayYes; }
});
$("#yesBtn").addEventListener("click", sayYes);
function sayYes(){ go("end"); petals(240); setTimeout(() => petals(160), 700); if (ctx){ const t = ctx.currentTime; [0, .2, .4].forEach(d => dhum(t + d)); } }
$("#replay").addEventListener("click", () => location.reload());

/* ---------- marigold petals ---------- */
const cv = $("#petals"), cx = cv.getContext("2d");
let parts = [], running = false;
const CW = () => cv.clientWidth || innerWidth, CH = () => cv.clientHeight || innerHeight;
function size(){ const r = devicePixelRatio || 1; cv.width = CW() * r; cv.height = CH() * r; cx.setTransform(r, 0, 0, r, 0, 0); }
size(); addEventListener("resize", size);
const PC = ["#F59E1B","#FFB627","#F57C1F","#D6246E","#FFF4DF","#E9B44C"];
function petals(n = 150){
  if (reduce) return;
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * CW(), y: -20 - Math.random() * CH() * .5, vx: (Math.random() - .5) * 1.4, vy: 1.6 + Math.random() * 2.4,
    s: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .12, c: PC[i % PC.length], w: Math.random() * 6 });
  if (!running){ running = true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0, 0, CW(), CH());
  parts.forEach(p => { p.w += .05; p.x += p.vx + Math.sin(p.w) * .6; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .55, 0, 0, Math.PI * 2); cx.fill(); cx.restore(); });
  parts = parts.filter(p => p.y < CH() + 30);
  if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, CW(), CH()); }
}

/* ---------- homepage showcase (?autoplay): silent, plays itself ---------- */
async function runAutoplay(){
  const wait = ms => new Promise(r => setTimeout(r, ms));
  document.body.style.pointerEvents = "none";
  await wait(1400); startRaas();
  for (let i = 0; i < 9; i++){
    await wait(500);
    for (let k = 0; k < NEED; k++){ const off = (now() - beatT0) % BEAT; await wait(BEAT - off + 10); onDhol(); }
    await wait(i < 3 ? 1900 : 900);
    $("#cardBtn").click();
  }
  await wait(2600);
  if (seq.includes("letter")){ $("#afterBtn").click(); await wait(4200); $("[data-scene=letter] [data-next]").click(); }
  else $("#afterBtn").click();
  if (seq.includes("ask")){ await wait(1600); $("#againBtn").click(); await wait(1000); sayYes(); await wait(3600); }
  if (parent !== window) parent.postMessage({ type: "tsc-autoplay-done" }, location.origin);
  else location.reload();
}
